<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secret Scene AR - Si Pagong at si Kuneho</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', "Segoe UI", sans-serif;
      background: #000;
    }

    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(5, 7, 18, 0.76), rgba(5, 7, 18, 0.88)),
        url("../../assets/images/bghero.png") center / cover no-repeat;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startup-panel {
      width: min(360px, 100%);
      padding: 24px 22px;
    }

    #startup-panel h1 {
      margin-bottom: 14px;
      color: #fffdf7;
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    #startup-status {
      min-height: 20px;
      margin-bottom: 14px;
      color: #f7f3dc;
      font-size: 0.8rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.42);
    }

    #startup-progress {
      width: 100%;
      height: 8px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    #startup-progress-bar {
      width: 16%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a3e635, #22c55e);
      transition: width 0.3s ease;
    }

    #startup-actions {
      display: grid;
      gap: 10px;
    }

    #preview-startup-btn,
    #start-camera-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.45);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    #preview-startup-btn {
      display: none;
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    #preview-startup-btn.visible {
      display: block;
    }

    #start-camera-btn:disabled {
      cursor: wait;
      opacity: 0.55;
      box-shadow: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    #ui-overlay a,
    #ui-overlay button {
      pointer-events: auto;
    }

    #back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(10, 10, 26, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }

    #scan-hint {
      position: absolute;
      bottom: 116px;
      left: 50%;
      opacity: 0;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 24px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      font-size: 0.88rem;
      white-space: nowrap;
      transition: opacity 0.35s ease;
    }

    #music-player {
      position: absolute;
      left: 50%;
      bottom: 18px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
    }

    #player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 14px 36px rgba(92, 64, 28, 0.16);
      backdrop-filter: blur(14px);
    }

    .player-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 999px;
      color: #3b2507;
      background: #fff7e6;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        0 5px 0 rgba(214, 137, 38, 0.45),
        0 12px 20px rgba(180, 83, 9, 0.12);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    #play-pause {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #ffd166 0%, #f59e0b 100%);
      font-size: 1.2rem;
    }

    #track-name {
      display: block;
      min-width: 92px;
      padding: 5px 12px;
      border-radius: 999px;
      color: #3b2507;
      background: rgba(255, 247, 230, 0.76);
      box-shadow: 0 8px 18px rgba(92, 64, 28, 0.1);
      font-size: 0.82rem;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      transform-origin: center;
    }

    #music-player.is-playing #track-name {
      animation: track-bounce 0.72s ease-in-out infinite;
    }

    @keyframes track-bounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }

    .mindar-ui-overlay {
      top: 56px !important;
    }

    @media (max-width: 480px) {
      #music-player {
        bottom: 14px;
        gap: 7px;
      }

      #player-controls {
        gap: 9px;
        padding: 8px 10px;
      }

      .player-btn {
        width: 38px;
        height: 38px;
      }

      #play-pause {
        width: 48px;
        height: 48px;
      }

      #track-name {
        min-width: 74px;
        font-size: 0.75rem;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="../../assets/images/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon/favicon.svg">
  <link rel="shortcut icon" href="../../assets/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="../../assets/images/favicon/site.webmanifest">
</head>

<body>
  <div id="startup-screen">
    <div id="startup-panel">
      <h1>Secret Scene</h1>
      <div id="startup-status">Loading AR files...</div>
      <div id="startup-progress" aria-hidden="true">
        <div id="startup-progress-bar"></div>
      </div>
      <div id="startup-actions">
        <button id="start-camera-btn" onclick="startCamera()" disabled>Start Camera</button>
        <a id="preview-startup-btn" href="./index.html">Preview</a>
      </div>
    </div>
  </div>

  <div id="ui-overlay">
    <a href="./index.html" id="back-btn">&larr; Preview</a>
    <div id="scan-hint">Point at the secret marker</div>

    <div id="music-player">
      <span id="track-name">music 1</span>
      <div id="player-controls">
        <button class="player-btn" type="button" onclick="previousTrack()" aria-label="Previous track">&lt;</button>
        <button class="player-btn" id="play-pause" type="button" onclick="togglePlayback()" aria-label="Play or pause">&#9658;</button>
        <button class="player-btn" type="button" onclick="nextTrack()" aria-label="Next track">&gt;</button>
      </div>
    </div>
  </div>

  <audio id="music-audio" preload="auto"></audio>

  <a-scene
    mindar-image="imageTargetSrc: ../../assets/images/markers/targets-extrascene.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="diorama-model" src="./diorama.glb"></a-asset-item>
      <a-asset-item id="turtle-model" src="../../models/turtle.glb"></a-asset-item>
      <a-asset-item id="rabbit-model" src="../../models/rabbit.glb"></a-asset-item>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
      <a-entity id="diorama-scene" position="0 -0.15 0" rotation="0 0 0" scale="0.04 0.04 0.04">
        <a-entity id="diorama-base"
          gltf-model="#diorama-model"
          scale="1.001 1.001 1.001"
          position="0 0 0"
          shadow="cast: true; receive: true">
        </a-entity>

        <a-entity id="pagong"
          gltf-model="#turtle-model"
          position="-2 2.2 9"
          scale="0.2 0.2 0.2"
          rotation="0 0 0"
          shadow="cast: true; receive: true">
        </a-entity>

        <a-entity id="kuneho"
          gltf-model="#rabbit-model"
          position="3.8 3 9.7"
          scale="0.004 0.004 0.004"
          rotation="0 180 0"
          shadow="cast: true; receive: true">
        </a-entity>
      </a-entity>
    </a-entity>

    <a-light id="ambient-light" type="ambient" color="#fff6e6" intensity="0.64"></a-light>
    <a-light id="sun-light" type="directional" color="#ffd08a" intensity="1.25" position="-6 5 5" shadow="cast: true"></a-light>
    <a-light id="warm-light" type="point" color="#fff0c2" intensity="0.65" distance="28" position="-5 6 4"></a-light>
    <a-light id="cool-light" type="point" color="#c7ddff" intensity="0.25" distance="22" position="6 5 -5"></a-light>

    <a-camera></a-camera>
  </a-scene>

  <script>
    function log(message) {
      console.log('[Extra AR]', message);
    }

    const BASE_POSES = {
      pagong: { x: -2, y: 2.2, z: 9, scale: 0.2, ry: 0 },
      kuneho: { x: 3.8, y: 3, z: 9.7, scale: 0.004, ry: 180 }
    };
    const TRACKS = [
      { name: 'music 1', src: '../../assets/audio/extra/es-music1.mp3', animation: 'animation-1' },
      { name: 'music 2', src: '../../assets/audio/extra/es-music2.mp3', animation: 'animation-2' },
      { name: 'music 3', src: '../../assets/audio/extra/es-music3.mp3', animation: 'animation-3' }
    ];
    const TRACK_MOODS = [
      {
        ambient: '#fff1bd',
        sun: '#ffd875',
        warm: '#ffb36b',
        cool: '#c7b6ff'
      },
      {
        ambient: '#fff5fb',
        sun: '#ffc8dd',
        warm: '#ffe0ef',
        cool: '#cdd8f4'
      },
      {
        ambient: '#f0fffd',
        sun: '#fff176',
        warm: '#ffcf70',
        cool: '#b8eaff'
      }
    ];
    const PRELOAD_ASSETS = [
      '../../assets/images/markers/targets-extrascene.mind',
      './diorama.glb',
      '../../models/turtle.glb',
      '../../models/rabbit.glb',
      ...TRACKS.map(track => track.src)
    ];

    const startupScreen = document.getElementById('startup-screen');
    const startupStatus = document.getElementById('startup-status');
    const startupBar = document.getElementById('startup-progress-bar');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const previewStartupBtn = document.getElementById('preview-startup-btn');
    const sceneEl = document.querySelector('a-scene');
    const assetsEl = document.querySelector('a-assets');
    const arTarget = document.getElementById('ar-target');
    const musicPlayer = document.getElementById('music-player');

    let sceneLoaded = false;
    let assetsLoaded = false;
    let filesLoaded = false;
    let cameraStarted = false;
    let animationFrameId = null;
    let animationStartedAt = 0;
    let animationRunning = false;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let moodFrameId = null;
    let moodStartedAt = 0;

    function setStartupStatus(message, progress) {
      startupStatus.textContent = message;
      startupBar.style.width = progress + '%';
      log(message);
    }

    function updateStartButton() {
      if (sceneLoaded && assetsLoaded && filesLoaded && !cameraStarted) {
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Start Camera';
        previewStartupBtn.classList.add('visible');
        setStartupStatus('Ready. Tap Start Camera.', 100);
      }
    }

    async function preloadFiles() {
      let loaded = 0;
      setStartupStatus('Loading AR files...', 16);

      await Promise.all(PRELOAD_ASSETS.map(async asset => {
        try {
          const response = await fetch(asset, { cache: 'force-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          await response.blob();
        } catch (error) {
          console.warn(error);
        } finally {
          loaded += 1;
          setStartupStatus('Loading AR files...', 16 + Math.round((loaded / PRELOAD_ASSETS.length) * 58));
        }
      }));

      filesLoaded = true;
      setStartupStatus('Preparing 3D scene...', 82);
      updateStartButton();
    }

    async function startCamera() {
      if (cameraStarted || startCameraBtn.disabled) return;
      cameraStarted = true;
      startCameraBtn.disabled = true;
      startCameraBtn.textContent = 'Starting camera...';
      setStartupStatus('Starting camera...', 100);

      try {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) throw new Error('MindAR system is not ready');
        await arSystem.start();
      } catch (error) {
        cameraStarted = false;
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Try Again';
        setStartupStatus('Camera could not start. Check browser permission.', 100);
        log('Camera start error: ' + error.message);
      }
    }

    sceneEl.addEventListener('loaded', () => {
      sceneLoaded = true;
      setStartupStatus('3D scene ready.', 86);
      updateStartButton();
    });

    assetsEl.addEventListener('loaded', () => {
      assetsLoaded = true;
      setStartupStatus('3D models ready.', 92);
      updateStartButton();
    });

    sceneEl.addEventListener('arReady', () => {
      startupScreen.classList.add('hidden');
      document.getElementById('scan-hint').style.opacity = '1';
      musicPlayer.style.display = 'flex';
    });

    sceneEl.addEventListener('arError', () => {
      cameraStarted = false;
      startCameraBtn.disabled = false;
      startCameraBtn.textContent = 'Try Again';
      setStartupStatus('AR could not start. Check camera permission.', 100);
    });

    arTarget.addEventListener('targetFound', () => {
      document.getElementById('scan-hint').style.opacity = '0';
    });

    arTarget.addEventListener('targetLost', () => {
      document.getElementById('scan-hint').style.opacity = '1';
      pauseCurrentTrack();
    });

    ['diorama-base', 'pagong', 'kuneho'].forEach(id => {
      const model = document.getElementById(id);
      model.addEventListener('model-loaded', () => log(`${id} model loaded.`));
      model.addEventListener('model-error', event => log(`${id} model failed: ${event.detail?.src || 'unknown source'}`));
    });

    function applyPose(key, pose) {
      const entity = document.getElementById(key);
      entity.setAttribute('position', `${pose.x.toFixed(3)} ${pose.y.toFixed(3)} ${pose.z.toFixed(3)}`);
      entity.setAttribute('rotation', `${(pose.rx || 0).toFixed(2)} ${pose.ry.toFixed(2)} ${(pose.rz || 0).toFixed(2)}`);
    }

    function resetActors() {
      Object.entries(BASE_POSES).forEach(([key, pose]) => {
        const entity = document.getElementById(key);
        entity.setAttribute('position', `${pose.x} ${pose.y} ${pose.z}`);
        entity.setAttribute('rotation', `0 ${pose.ry} 0`);
        entity.setAttribute('scale', `${pose.scale} ${pose.scale} ${pose.scale}`);
      });
    }

    function currentAnimation() {
      return TRACKS[currentTrackIndex].animation;
    }

    function animationTick(timestamp) {
      if (!animationRunning) return;
      if (!animationStartedAt) animationStartedAt = timestamp;

      const elapsed = (timestamp - animationStartedAt) / 1000;
      const selected = currentAnimation();
      const pagongBase = BASE_POSES.pagong;
      const kunehoBase = BASE_POSES.kuneho;

      if (selected === 'animation-1') {
        const pagongJump = Math.abs(Math.sin(elapsed * Math.PI * 2.15)) * 0.55;
        const kunehoJump = Math.abs(Math.sin((elapsed * Math.PI * 2.45) + 1.25)) * 0.72;
        applyPose('pagong', { ...pagongBase, y: pagongBase.y + pagongJump });
        applyPose('kuneho', { ...kunehoBase, y: kunehoBase.y + kunehoJump });
      }

      if (selected === 'animation-2') {
        const pagongSway = Math.sin(elapsed * Math.PI * 1.45) * 9;
        const kunehoSway = Math.sin((elapsed * Math.PI * 1.65) + 0.8) * 12;
        applyPose('pagong', { ...pagongBase, rz: pagongSway });
        applyPose('kuneho', { ...kunehoBase, rz: kunehoSway });
      }

      if (selected === 'animation-3') {
        const pagongJump = Math.abs(Math.sin(elapsed * Math.PI * 2.05)) * 0.48;
        const kunehoJump = Math.abs(Math.sin((elapsed * Math.PI * 2.35) + 1.35)) * 0.65;
        const pagongSpin = Math.sin(elapsed * Math.PI * 1.15) * 28;
        const kunehoSpin = Math.sin((elapsed * Math.PI * 1.35) + 0.75) * 38;
        applyPose('pagong', { ...pagongBase, y: pagongBase.y + pagongJump, ry: pagongBase.ry + pagongSpin });
        applyPose('kuneho', { ...kunehoBase, y: kunehoBase.y + kunehoJump, ry: kunehoBase.ry + kunehoSpin });
      }

      animationFrameId = requestAnimationFrame(animationTick);
    }

    function startAnimation() {
      if (animationRunning) return;
      animationRunning = true;
      animationStartedAt = 0;
      animationFrameId = requestAnimationFrame(animationTick);
    }

    function stopAnimation() {
      animationRunning = false;
      animationStartedAt = 0;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      resetActors();
    }

    function applyMood() {
      const mood = TRACK_MOODS[currentTrackIndex];
      document.getElementById('ambient-light').setAttribute('color', mood.ambient);
      document.getElementById('sun-light').setAttribute('color', mood.sun);
      document.getElementById('warm-light').setAttribute('color', mood.warm);
      document.getElementById('cool-light').setAttribute('color', mood.cool);
    }

    function resetMood() {
      document.getElementById('ambient-light').setAttribute('color', '#fff6e6');
      document.getElementById('sun-light').setAttribute('color', '#ffd08a');
      document.getElementById('warm-light').setAttribute('color', '#fff0c2');
      document.getElementById('cool-light').setAttribute('color', '#c7ddff');
    }

    function moodTick(timestamp) {
      if (!isPlaying) return;
      if (!moodStartedAt) moodStartedAt = timestamp;
      const elapsed = (timestamp - moodStartedAt) / 1000;
      const pulse = currentTrackIndex === 0
        ? Math.abs(Math.sin(elapsed * Math.PI * 2.45))
        : (Math.sin(elapsed * Math.PI * 0.45) + 1) / 2;
      document.getElementById('sun-light').setAttribute('intensity', (1.05 + pulse * 0.28).toFixed(2));
      moodFrameId = requestAnimationFrame(moodTick);
    }

    function startMoodPulse() {
      if (moodFrameId) cancelAnimationFrame(moodFrameId);
      moodStartedAt = 0;
      applyMood();
      moodFrameId = requestAnimationFrame(moodTick);
    }

    function stopMoodPulse() {
      if (moodFrameId) {
        cancelAnimationFrame(moodFrameId);
        moodFrameId = null;
      }
      moodStartedAt = 0;
      resetMood();
      document.getElementById('sun-light').setAttribute('intensity', '1.25');
    }

    function loadTrack(index) {
      currentTrackIndex = (index + TRACKS.length) % TRACKS.length;
      const track = TRACKS[currentTrackIndex];
      const audio = document.getElementById('music-audio');
      const shouldResume = isPlaying;
      audio.src = track.src;
      audio.currentTime = 0;
      document.getElementById('track-name').textContent = track.name;
      stopAnimation();
      stopMoodPulse();
      setPlayButton(true);
      if (shouldResume) playCurrentTrack();
    }

    function setPlayButton(paused) {
      document.getElementById('play-pause').innerHTML = paused ? '&#9658;' : '&#10073;&#10073;';
      musicPlayer.classList.toggle('is-playing', !paused);
    }

    function playCurrentTrack() {
      const audio = document.getElementById('music-audio');
      isPlaying = true;
      audio.play().then(() => {
        setPlayButton(false);
        startMoodPulse();
        startAnimation();
      }).catch(() => {
        isPlaying = false;
        setPlayButton(true);
        stopMoodPulse();
      });
    }

    function pauseCurrentTrack() {
      const audio = document.getElementById('music-audio');
      isPlaying = false;
      audio.pause();
      stopAnimation();
      setPlayButton(true);
      stopMoodPulse();
    }

    function togglePlayback() {
      isPlaying ? pauseCurrentTrack() : playCurrentTrack();
    }

    function nextTrack() {
      loadTrack(currentTrackIndex + 1);
    }

    function previousTrack() {
      loadTrack(currentTrackIndex - 1);
    }

    document.getElementById('music-audio').addEventListener('ended', nextTrack);

    if (sceneEl.hasLoaded) sceneLoaded = true;
    if (assetsEl.hasLoaded) assetsLoaded = true;

    resetActors();
    loadTrack(0);
    preloadFiles();
    updateStartButton();
  </script>
</body>
</html>
