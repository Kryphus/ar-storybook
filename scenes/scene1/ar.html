<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pahina 1 AR — Si Pagong at si Kuneho</title>
  <meta name="description" content="AR Scene 1: Ang Simula. Point your camera at Pahina 1.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- A-Frame must load before MindAR's A-Frame integration. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
    }

    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(rgba(5, 7, 18, 0.76), rgba(5, 7, 18, 0.88)),
        url("../../assets/images/bghero.png") center / cover no-repeat;
      color: white;
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startup-panel {
      width: min(360px, 100%);
      padding: 24px 22px;
    }

    #startup-panel h1 {
      font-size: 1.6rem;
      line-height: 1.15;
      margin-bottom: 10px;
      color: #fffdf7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    #startup-panel p {
      color: rgba(255,255,255,0.78);
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    #startup-status {
      min-height: 20px;
      color: #f7f3dc;
      text-shadow: 0 2px 10px rgba(0,0,0,0.42);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    #startup-progress {
      width: 100%;
      height: 8px;
      margin-bottom: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.28);
    }

    #startup-progress-bar {
      width: 16%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a3e635, #22c55e);
      transition: width 0.3s ease;
    }

    #startup-actions {
      display: grid;
      gap: 10px;
    }

    #preview-startup-btn,
    #start-camera-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(102,126,234,0.45);
    }

    #preview-startup-btn {
      display: none;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: none;
    }

    #preview-startup-btn.visible {
      display: block;
    }

    #start-camera-btn:disabled {
      cursor: wait;
      opacity: 0.55;
      box-shadow: none;
    }

    /* MindAR renders its own fullscreen canvas — keep it under everything */
    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    /* ===== UI OVERLAY (sits above the AR canvas) ===== */
    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none; /* let touches pass through to AR by default */
    }

    /* All tappable overlay elements get pointer-events back */
    #ui-overlay a,
    #ui-overlay button {
      pointer-events: auto;
    }

    /* Back button — top left */
    #back-btn {
      position: absolute;
      top: 14px; left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      background: rgba(10,10,26,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.9);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    #back-btn:active { transform: scale(0.95); }
    /* Scan hint — shown while waiting for marker */
    #scan-hint {
      position: absolute;
      bottom: 122px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: opacity 0.4s;
      opacity: 0;
    }

    #scan-guide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 360px);
      aspect-ratio: 3 / 4;
      opacity: 0;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.82);
      border-radius: 18px;
      box-shadow:
        0 0 0 999px rgba(0, 0, 0, 0.18),
        0 0 24px rgba(255, 255, 255, 0.18);
      transition: opacity 0.35s ease;
    }

    #scan-guide::before,
    #scan-guide::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: #a3e635;
      border-style: solid;
    }

    #scan-guide::before {
      top: -2px;
      left: -2px;
      border-width: 4px 0 0 4px;
      border-radius: 16px 0 0 0;
    }

    #scan-guide::after {
      right: -2px;
      bottom: -2px;
      border-width: 0 4px 4px 0;
      border-radius: 0 0 16px 0;
    }

    #scan-guide.visible,
    #scan-hint.visible {
      opacity: 1;
    }

    @media (orientation: landscape) {
      #scan-guide {
        width: min(62vw, 520px);
        height: min(62vh, 320px);
        aspect-ratio: auto;
      }

      #scan-hint {
        bottom: 92px;
      }
    }

    /* Play / Stop button — bottom center */
    #anim-btn {
      position: absolute;
      bottom: 32px;
      left: 50%;
      display: none;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.4px;
      box-shadow: 0 4px 20px rgba(102,126,234,0.55);
      transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
      white-space: nowrap;
    }
    #anim-btn:active { transform: translateX(-50%) scale(0.95); }
    #anim-btn.playing {
      background: linear-gradient(135deg, #f05454 0%, #c0392b 100%);
      box-shadow: 0 4px 20px rgba(240,84,84,0.45);
    }

    #reset-ar-btn {
      position: absolute;
      right: 16px;
      bottom: 32px;
      display: none;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      color: rgba(255,255,255,0.92);
      background: rgba(10,10,26,0.72);
      box-shadow: 0 4px 18px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    #reset-ar-btn:active {
      transform: scale(0.92);
    }

    #reset-ar-btn.visible {
      display: block;
    }
    /* Push MindAR's scan frame below our nav bar */
    .mindar-ui-overlay {
      top: 56px !important;
    }
  </style>

  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon/favicon.svg">
  <link rel="shortcut icon" href="../../assets/images/favicon/favicon.ico">

<body>

  <div id="startup-screen">
    <div id="startup-panel">
      <h1>Pahina 1</h1>
      <div id="startup-status">Loading AR files...</div>
      <div id="startup-progress" aria-hidden="true">
        <div id="startup-progress-bar"></div>
      </div>
      <div id="startup-actions">
        <button id="start-camera-btn" onclick="startCamera()" disabled>Start Camera</button>
        <a id="preview-startup-btn" href="./index.html">Preview</a>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!--  UI OVERLAY                                   -->
  <!-- ============================================ -->
  <div id="ui-overlay">

    <a href="../../pages.html" id="back-btn">← Pahina</a>

    <div id="scan-guide" aria-hidden="true"></div>
    <div id="scan-hint">Center the full Pahina 1 marker</div>

    <button id="anim-btn" onclick="handleAnimBtn()">&#9654; &nbsp; I-play</button>
    <button id="reset-ar-btn" type="button" onclick="resetARPlacement()" aria-label="Reset AR placement">↺</button>
  </div>

  <!-- ============================================ -->
  <!--  NARRATION AUDIO                              -->
  <!-- ============================================ -->
  <audio id="narration" src="../../assets/audio/scene1.mp3" preload="auto"></audio>

  <!-- ============================================ -->
  <!--  AR SCENE (MindAR)                            -->
  <!-- ============================================ -->
  <!--
    imageTargetSrc: the compiled .mind file for Pahina 1
    autoStart: false — we start manually after scene loads
    uiLoading / uiScanning: use MindAR's built-in loading + scan UI
  -->
  <a-scene
    mindar-image="imageTargetSrc: ../../assets/images/markers/targets-scene1.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Diorama is in this scene's folder -->
      <a-asset-item id="diorama-model" src="./diorama.glb"></a-asset-item>
      <!-- Characters are shared project-wide -->
      <a-asset-item id="turtle-model"  src="../../models/turtle.glb"></a-asset-item>
      <a-asset-item id="rabbit-model"  src="../../models/rabbit.glb"></a-asset-item>
    </a-assets>

    <!--
      targetIndex: 0  =  page1.jpg (first image uploaded to MindAR compiler)
      When the camera sees page 1 of the storybook, this entity becomes visible.
    -->
    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">

      <!--
        diorama-scene: the outer container.
        scale="0.025" makes everything fit over a physical book page.
      -->
      <a-entity id="diorama-scene"
        position="0 0 0"
        scale="0.025 0.025 0.025">

        <!-- DIORAMA BASE — Scene 1 diorama -->
        <a-entity id="diorama-base"
          gltf-model="#diorama-model"
          scale="2.696 2.696 2.696"
          position="0 -4.0 0">
        </a-entity>

        <!-- TURTLE (Pagong) — Scene 1 position -->
        <a-entity id="pagong"
          gltf-model="#turtle-model"
          position="13.7 3 12.6"
          scale="0.5 0.5 0.5"
          rotation="0 -55 0">
        </a-entity>

        <!-- RABBIT (Kuneho) — Scene 1 position -->
        <a-entity id="kuneho"
          gltf-model="#rabbit-model"
          position="-12.6 5.2 12.6"
          scale="0.01 0.01 0.01"
          rotation="0 -155 0">
        </a-entity>

      </a-entity>
    </a-entity>
    <!-- END ar-target -->

    <!-- Lights -->
    <a-light type="ambient"     color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffeedd" intensity="0.9" position="0 5 5"></a-light>

    <!-- MindAR needs a plain <a-camera> — no orbit controls in AR -->
    <a-camera></a-camera>

  </a-scene>

  <script>
    function log(msg) {
      console.log('[AR]', msg);
    }

    const startupScreen = document.getElementById('startup-screen');
    const startupStatus = document.getElementById('startup-status');
    const startupBar = document.getElementById('startup-progress-bar');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const previewStartupBtn = document.getElementById('preview-startup-btn');
    const assetsEl = document.querySelector('a-assets');
    let markerLoaded = false;
    let sceneLoaded = false;
    let assetsLoaded = false;
    let requiredFilesLoaded = false;
    let cameraStarted = false;

    function setStartupStatus(message, progress) {
      startupStatus.textContent = message;
      startupBar.style.width = progress + '%';
      log(message);
    }

    async function fetchRequiredFile(url) {
      const response = await fetch(url, { cache: 'force-cache' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      await response.arrayBuffer();
    }

    function updateStartButton() {
      if (markerLoaded && sceneLoaded && assetsLoaded && requiredFilesLoaded && !cameraStarted) {
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Start Camera';
        previewStartupBtn.classList.add('visible');
        setStartupStatus('Ready. Tap Start Camera.', 100);
      }
    }

    async function preloadSceneFiles() {
      setStartupStatus('Loading AR files...', 18);
      try {
        await fetchRequiredFile('../../assets/images/markers/targets-scene1.mind');
        markerLoaded = true;
        setStartupStatus('Page marker ready.', 45);
      } catch (error) {
        startCameraBtn.disabled = true;
        startCameraBtn.textContent = 'Marker failed to load';
        setStartupStatus('Could not load marker file. Serve the app from localhost or HTTPS.', 100);
        log('Marker preload error: ' + error.message);
        updateStartButton();
        return;
      }

      const fileChecks = [
        fetchRequiredFile('./diorama.glb')
          .then(() => setStartupStatus('Scene diorama ready.', 60))
          .catch((error) => {
            log('Diorama preload error: ' + error.message);
          }),
        Promise.all([
          fetchRequiredFile('../../models/turtle.glb'),
          fetchRequiredFile('../../models/rabbit.glb')
        ])
          .then(() => setStartupStatus('Pagong and Kuneho ready.', 72))
          .catch((error) => {
            log('Character preload error: ' + error.message);
          }),
        fetchRequiredFile('../../assets/audio/scene1.mp3')
          .then(() => setStartupStatus('Narration ready.', 84))
          .catch((error) => {
            log('Narration preload error: ' + error.message);
          })
      ];

      await Promise.allSettled(fileChecks);
      requiredFilesLoaded = true;
      updateStartButton();
    }

    async function startCamera() {
      if (cameraStarted || startCameraBtn.disabled) return;
      cameraStarted = true;
      startCameraBtn.disabled = true;
      startCameraBtn.textContent = 'Starting camera...';
      setStartupStatus('Starting camera...', 100);

      try {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) throw new Error('MindAR system is not ready');
        await arSystem.start();
      } catch (error) {
        cameraStarted = false;
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Try Again';
        setStartupStatus('Camera could not start. Check browser permission.', 100);
        log('Camera start error: ' + error.message);
      }
    }

    // Catch any uncaught JS errors
    window.addEventListener('error', (e) => {
      log('❌ JS Error: ' + e.message + ' (' + e.filename?.split('/').pop() + ':' + e.lineno + ')');
    });

    // ============================================================
    //  MARKER EVENTS — auto-play when page is detected
    // ============================================================
    const arTarget = document.getElementById('ar-target');
    const sceneEl  = document.querySelector('a-scene');
    const scanHint = document.getElementById('scan-hint');
    const scanGuide = document.getElementById('scan-guide');
    const dioramaScene = document.getElementById('diorama-scene');
    const resetArBtn = document.getElementById('reset-ar-btn');
    const DEFAULT_AR_POSITION = { x: 0, y: 0, z: 0 };
    const DEFAULT_AR_SCALE = 0.025;
    const MIN_AR_SCALE = 0.009;
    const MAX_AR_SCALE = 0.09;
    const DRAG_SENSITIVITY = 0.0022;
    const POSITION_LIMIT = 0.8;
    let arPosition = { ...DEFAULT_AR_POSITION };
    let arScale = DEFAULT_AR_SCALE;
    let lastTouchPoint = null;
    let pinchStartDistance = 0;
    let pinchStartScale = DEFAULT_AR_SCALE;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setDioramaPlacement(position = arPosition, scale = arScale) {
      dioramaScene.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
      dioramaScene.setAttribute('scale', `${scale} ${scale} ${scale}`);
    }

    function resetARPlacement() {
      arPosition = { ...DEFAULT_AR_POSITION };
      arScale = DEFAULT_AR_SCALE;
      lastTouchPoint = null;
      pinchStartDistance = 0;
      pinchStartScale = DEFAULT_AR_SCALE;
      setDioramaPlacement(arPosition, arScale);
    }

    function showScanGuide() {
      scanHint.classList.add('visible');
      scanGuide.classList.add('visible');
    }

    function hideScanGuide() {
      scanHint.classList.remove('visible');
      scanGuide.classList.remove('visible');
    }

    function isUiTouch(event) {
      return Boolean(event.target.closest('#ui-overlay button, #ui-overlay a, #startup-screen'));
    }

    function getTouchPoint(touch) {
      return { x: touch.clientX, y: touch.clientY };
    }

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    function getDragDelta(dx, dy) {
      if (window.matchMedia('(orientation: landscape)').matches) {
        return {
          x: -dy * DRAG_SENSITIVITY,
          y: -dx * DRAG_SENSITIVITY
        };
      }

      return {
        x: dx * DRAG_SENSITIVITY,
        y: -dy * DRAG_SENSITIVITY
      };
    }

    function handleTouchStart(event) {
      if (!cameraStarted || isUiTouch(event)) return;

      if (event.touches.length === 1) {
        lastTouchPoint = getTouchPoint(event.touches[0]);
      } else if (event.touches.length === 2) {
        lastTouchPoint = null;
        pinchStartDistance = getTouchDistance(event.touches);
        pinchStartScale = arScale;
      }
    }

    function handleTouchMove(event) {
      if (!cameraStarted || isUiTouch(event)) return;
      if (event.cancelable) event.preventDefault();

      if (event.touches.length === 1 && lastTouchPoint) {
        const point = getTouchPoint(event.touches[0]);
        const dx = point.x - lastTouchPoint.x;
        const dy = point.y - lastTouchPoint.y;
        const delta = getDragDelta(dx, dy);

        arPosition.x = clamp(arPosition.x + delta.x, -POSITION_LIMIT, POSITION_LIMIT);
        arPosition.y = clamp(arPosition.y + delta.y, -POSITION_LIMIT, POSITION_LIMIT);
        setDioramaPlacement(arPosition, arScale);
        lastTouchPoint = point;
      } else if (event.touches.length === 2 && pinchStartDistance > 0) {
        const distance = getTouchDistance(event.touches);
        arScale = clamp(pinchStartScale * (distance / pinchStartDistance), MIN_AR_SCALE, MAX_AR_SCALE);
        setDioramaPlacement(arPosition, arScale);
      }
    }

    function handleTouchEnd(event) {
      if (event.touches.length === 1) {
        lastTouchPoint = getTouchPoint(event.touches[0]);
      } else {
        lastTouchPoint = null;
        pinchStartDistance = 0;
        pinchStartScale = arScale;
      }
    }

    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });
    window.addEventListener('touchend', handleTouchEnd, { passive: false });
    window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    sceneEl.addEventListener('arReady', () => {
      log('MindAR ready - camera active.');
      startupScreen.classList.add('hidden');
      showScanGuide();
      document.getElementById('anim-btn').style.display = 'block';
      resetArBtn.classList.add('visible');
    });
    sceneEl.addEventListener('arError', (e) => {
      cameraStarted = false;
      startCameraBtn.disabled = false;
      startCameraBtn.textContent = 'Try Again';
      setStartupStatus('AR could not start. Check camera permission.', 100);
      log('MindAR error: ' + JSON.stringify(e.detail));
    });
    sceneEl.addEventListener('loaded',  () => {
      sceneLoaded = true;
      setStartupStatus('AR camera engine ready.', 92);
      updateStartButton();
    });

    assetsEl.addEventListener('loaded', () => {
      assetsLoaded = true;
      updateStartButton();
    });

    if (sceneEl.hasLoaded) {
      sceneLoaded = true;
      setStartupStatus('AR camera engine ready.', 92);
    }

    if (assetsEl.hasLoaded) {
      assetsLoaded = true;
    }

    updateStartButton();
    preloadSceneFiles();

    setTimeout(() => {
      if (!cameraStarted && (!sceneLoaded || !assetsLoaded)) {
        setStartupStatus('Still loading AR engine or models. Check internet if this gets stuck.', 92);
      }
    }, 12000);

    arTarget.addEventListener('targetFound', () => {
      hideScanGuide();
      // Auto-start animation + narration when the book page is detected
      startAnimation();
      startNarration();
    });

    arTarget.addEventListener('targetLost', () => {
      showScanGuide();
      // Pause narration when page is no longer visible (animation keeps going)
      pauseNarration();
    });

    // ============================================================
    //  NARRATION
    // ============================================================
    function startNarration() {
      const audio = document.getElementById('narration');
      audio.currentTime = 0;
      audio.play().catch(() => {
        // Autoplay blocked — user will need to tap Play manually
        console.warn('Narration autoplay blocked by browser.');
      });
    }

    function pauseNarration() {
      document.getElementById('narration').pause();
    }

    function stopNarration() {
      const audio = document.getElementById('narration');
      audio.pause();
      audio.currentTime = 0;
    }

    // ============================================================
    //  SCENE 1 — IDLE BOUNCE ANIMATION
    //  Exact same logic as scenes/scene1/index.html
    // ============================================================

    // 🐢 Turtle — slow, gentle, lazy hops
    const P_IDLE_H    = 0.55;
    const P_IDLE_FREQ = 1.1;
    const P_IDLE_LEAN = 8;

    // 🐇 Rabbit — fast, big clean hops
    const K_IDLE_H   = 2.5;
    const K_IDLE_FREQ = 2.4;
    const K_PHASE_MS  = 420;

    let animRunning  = false;
    let animStart    = null;
    let animFrameId  = null;

    // Resting positions (hardcoded — same as preview)
    const pagongFrom    = { x: 13.7,  y: 3,   z: 12.6 };
    const pagongBaseRot = -55;
    const kunehoFrom    = { x: -12.6, y: 5.2, z: 12.6 };
    const kunehoBaseRot = -155;

    function idleBounceTick(timestamp) {
      if (!animStart) animStart = timestamp;
      const elapsed = timestamp - animStart;

      // 🐢 Pagong
      const rawP    = Math.sin(elapsed / 1000 * P_IDLE_FREQ * Math.PI);
      const bounceP = Math.max(0, rawP) * P_IDLE_H;
      const leanP   = (bounceP / P_IDLE_H) * P_IDLE_LEAN;
      document.getElementById('pagong').setAttribute('position',
        `${pagongFrom.x} ${pagongFrom.y + bounceP} ${pagongFrom.z}`);
      document.getElementById('pagong').setAttribute('rotation',
        `${-leanP} ${pagongBaseRot} 0`);

      // 🐇 Kuneho
      const elapsedK = elapsed + K_PHASE_MS;
      const rawK     = Math.sin(elapsedK / 1000 * K_IDLE_FREQ * Math.PI);
      const bounceK  = Math.max(0, rawK) * K_IDLE_H;
      document.getElementById('kuneho').setAttribute('position',
        `${kunehoFrom.x} ${kunehoFrom.y + bounceK} ${kunehoFrom.z}`);
      document.getElementById('kuneho').setAttribute('rotation',
        `0 ${kunehoBaseRot} 0`);

      if (animRunning) animFrameId = requestAnimationFrame(idleBounceTick);
    }

    // ============================================================
    //  PLAY / STOP
    // ============================================================
    function handleAnimBtn() {
      animRunning ? stopAnimation() : startAnimation();
    }

    function startAnimation() {
      if (animRunning) return;
      animRunning = true;
      animStart   = null;

      const btn = document.getElementById('anim-btn');
      btn.classList.add('playing');
      btn.innerHTML = '&#9646; &nbsp; Ihinto';

      animFrameId = requestAnimationFrame(idleBounceTick);

      // Also start narration when user manually taps Play
      startNarration();
    }

    function stopAnimation() {
      animRunning = false;
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

      // Snap back to resting position
      document.getElementById('pagong').setAttribute('position',
        `${pagongFrom.x} ${pagongFrom.y} ${pagongFrom.z}`);
      document.getElementById('pagong').setAttribute('rotation',
        `0 ${pagongBaseRot} 0`);
      document.getElementById('kuneho').setAttribute('position',
        `${kunehoFrom.x} ${kunehoFrom.y} ${kunehoFrom.z}`);
      document.getElementById('kuneho').setAttribute('rotation',
        `0 ${kunehoBaseRot} 0`);

      const btn = document.getElementById('anim-btn');
      btn.classList.remove('playing');
      btn.innerHTML = '&#9654; &nbsp; I-play';

      stopNarration();
    }
  </script>

</body>
</html>
