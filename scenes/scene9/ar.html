<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pahina 9 AR — Si Pagong at si Kuneho</title>
  <meta name="description" content="AR Scene 9: Ang Tagumpay. Point your camera at Pahina 9.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- A-Frame must load before MindAR's A-Frame integration. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
    }

    #startup-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(rgba(5, 7, 18, 0.76), rgba(5, 7, 18, 0.88)),
        url("../../assets/images/bghero.png") center / cover no-repeat;
      color: white;
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startup-panel {
      width: min(360px, 100%);
      padding: 24px 22px;
    }

    #startup-panel h1 {
      font-size: 1.55rem;
      line-height: 1.15;
      margin-bottom: 8px;
      color: #fffdf7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    #startup-panel p {
      color: rgba(255,255,255,0.76);
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    #startup-status {
      min-height: 20px;
      color: #a3e635;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.42);
    }

    #startup-progress {
      width: 100%;
      height: 8px;
      margin-bottom: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
    }

    #startup-progress-bar {
      width: 16%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a3e635, #22c55e);
      transition: width 0.3s ease;
    }

    #startup-actions {
      display: grid;
      gap: 10px;
    }

    #preview-startup-btn,
    #start-camera-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px 20px;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(102,126,234,0.45);
    }

    #preview-startup-btn {
      display: none;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: none;
    }

    #preview-startup-btn.visible {
      display: block;
    }

    #start-camera-btn:disabled {
      cursor: wait;
      opacity: 0.55;
      box-shadow: none;
    }

    /* MindAR renders its own fullscreen canvas — keep it under everything */
    a-scene {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }

    canvas.a-canvas {
      position: fixed !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    /* ===== UI OVERLAY (sits above the AR canvas) ===== */
    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none; /* let touches pass through to AR by default */
    }

    /* All tappable overlay elements get pointer-events back */
    #ui-overlay a,
    #ui-overlay button {
      pointer-events: auto;
    }

    /* Back button — top left */
    #back-btn {
      position: absolute;
      top: 14px; left: 14px;
      display: block;
      width: 54px;
      height: 54px;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    #back-btn:active { transform: scale(0.95); }
    #back-btn img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 14px rgba(92, 64, 28, 0.28));
    }
/* Scan hint — shown while waiting for marker */
    #scan-hint {
      position: absolute;
      bottom: 122px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: opacity 0.4s;
      opacity: 0;
    }

    #scan-hint.visible {
      opacity: 1;
    }

    @media (orientation: landscape) {
      #scan-hint {
        bottom: 92px;
      }
    }

    /* Play / Stop button — bottom center */
    #anim-btn {
      position: absolute;
      bottom: 32px;
      left: 50%;
      display: none;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #ffd166 0%, #f59e0b 100%);
      border: 1px solid rgba(133, 77, 14, 0.28);
      color: #3b2507;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.4px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        0 5px 0 rgba(180, 83, 9, 0.72),
        0 16px 28px rgba(217, 119, 6, 0.28);
      transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
      white-space: nowrap;
    }
    #anim-btn:active {
      transform: translateX(-50%) translateY(2px) scale(0.96);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 2px 0 rgba(180, 83, 9, 0.72),
        0 8px 18px rgba(217, 119, 6, 0.2);
    }
    #anim-btn.playing {
      background: linear-gradient(135deg, #ffb347 0%, #f97316 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        0 5px 0 rgba(154, 52, 18, 0.7),
        0 16px 28px rgba(234, 88, 12, 0.26);
    }

    #reset-ar-btn {
      position: absolute;
      right: 16px;
      bottom: 32px;
      display: none;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(133, 77, 14, 0.28);
      border-radius: 999px;
      color: #3b2507;
      background: linear-gradient(135deg, #fff1b8 0%, #f59e0b 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        0 4px 0 rgba(180, 83, 9, 0.68),
        0 13px 24px rgba(217, 119, 6, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    #reset-ar-btn:active {
      transform: translateY(2px) scale(0.94);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 2px 0 rgba(180, 83, 9, 0.68),
        0 8px 18px rgba(217, 119, 6, 0.18);
    }

    #reset-ar-btn.visible {
      display: block;
    }
    /* ===== MindAR built-in overlay tweaks ===== */
/* Push MindAR's scan frame below our nav bar */
    .mindar-ui-overlay {
      top: 56px !important;
    }
  </style>

<body>

  <div id="startup-screen">
    <div id="startup-panel">
      <h1>Pahina 9</h1>
      <div id="startup-status">Loading AR files...</div>
      <div id="startup-progress" aria-hidden="true">
        <div id="startup-progress-bar"></div>
      </div>
      <div id="startup-actions">
        <button id="start-camera-btn" onclick="startCamera()" disabled>Start Camera</button>
        <a id="preview-startup-btn" href="./index.html">Preview</a>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!--  UI OVERLAY                                   -->
  <!-- ============================================ -->
  <div id="ui-overlay">

    <a href="../../pages.html" id="back-btn" aria-label="Back to pages">
      <img src="../../assets/images/back-button-arscreen.png" alt="">
    </a>

    <div id="scan-hint">Center the full Pahina 9 marker</div>

    <button id="anim-btn" onclick="handleAnimBtn()">&#9654; &nbsp; I-play</button>
    <button id="reset-ar-btn" type="button" onclick="resetARPlacement()" aria-label="Reset AR placement">↺</button>
  </div>

  <!-- ============================================ -->
  <!--  NARRATION AUDIO                              -->
  <!-- ============================================ -->
  <audio id="narration" src="../../assets/audio/scene9.mp3" preload="auto"></audio>
  <audio id="finish-sound" src="../../assets/audio/animal_crowd_yay.mp3" preload="auto"></audio>

  <!-- ============================================ -->
  <!--  AR SCENE (MindAR)                            -->
  <!-- ============================================ -->
  <!--
    imageTargetSrc: the compiled .mind file for Pahina 9
    autoStart: false — we start manually after scene loads
    uiLoading / uiScanning: use MindAR's built-in loading + scan UI
  -->
  <a-scene
    mindar-image="imageTargetSrc: ../../assets/images/markers/targets-scene9.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Diorama is in this scene's folder -->
      <a-asset-item id="diorama-model" src="./diorama.glb"></a-asset-item>
      <!-- Characters are shared project-wide -->
      <a-asset-item id="turtle-model"  src="../../models/turtle.glb"></a-asset-item>
      <a-asset-item id="rabbit-model"  src="../../models/rabbit.glb"></a-asset-item>
    </a-assets>

    <!--
      targetIndex: 0  =  page9.jpg in targets-scene9.mind
      When the camera sees page 9 of the storybook, this entity becomes visible.
    -->
    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">

      <!--
        diorama-scene: the outer container.
        scale="0.025" makes everything fit over a physical book page.
      -->
      <a-entity id="diorama-scene"
        position="0 0 0"
        scale="0.025 0.025 0.025">

        <!-- DIORAMA BASE — Scene 9 diorama -->
        <a-entity id="diorama-base"
          gltf-model="#diorama-model"
          scale="2.696 2.696 2.696"
          position="0 -4.0 0">
        </a-entity>

        <!-- TURTLE (Pagong) — Scene 9 start position -->
        <a-entity id="pagong"
          gltf-model="#turtle-model"
          position="-11.5 1.6 20.2"
          scale="0.5 0.5 0.5"
          rotation="0 -80 0">
        </a-entity>

        <!-- RABBIT (Kuneho) — Scene 9 start position -->
        <a-entity id="kuneho"
          gltf-model="#rabbit-model"
          position="4.2 4.2 24.6"
          scale="0.01 0.01 0.01"
          rotation="0 90 0">
        </a-entity>

      </a-entity>
    </a-entity>
    <!-- END ar-target -->

    <!-- Lights -->
    <a-light type="ambient"     color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffeedd" intensity="0.9" position="0 5 5"></a-light>

    <!-- MindAR needs a plain <a-camera> — no orbit controls in AR -->
    <a-camera></a-camera>

  </a-scene>

  <script>
    // ============================================================
    //  DIAGNOSTIC LOGGER
    // ============================================================
    function log(msg) {
      console.log('[AR]', msg);
    }

    const startupScreen = document.getElementById('startup-screen');
    const startupStatus = document.getElementById('startup-status');
    const startupBar = document.getElementById('startup-progress-bar');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const previewStartupBtn = document.getElementById('preview-startup-btn');
    const assetsEl = document.querySelector('a-assets');
    let markerLoaded = false;
    let sceneLoaded = false;
    let assetsLoaded = false;
    let cameraStarted = false;

    function setStartupStatus(message, progress) {
      startupStatus.textContent = message;
      startupBar.style.width = progress + '%';
      log(message);
    }

    function updateStartButton() {
      if (markerLoaded && sceneLoaded && assetsLoaded && !cameraStarted) {
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Start Camera';
        previewStartupBtn.classList.add('visible');
        setStartupStatus('Ready. Tap Start Camera.', 100);
      }
    }

    async function preloadMarkerFile() {
      setStartupStatus('Loading page marker...', 30);
      try {
        const response = await fetch('../../assets/images/markers/targets-scene9.mind', { cache: 'force-cache' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        await response.arrayBuffer();
        markerLoaded = true;
        setStartupStatus('Marker ready.', 65);
        if (!sceneLoaded || !assetsLoaded) {
          setStartupStatus('Loading AR engine and 3D models...', 70);
        }
      } catch (error) {
        startCameraBtn.disabled = true;
        startCameraBtn.textContent = 'Marker failed to load';
        setStartupStatus('Could not load marker file. Serve the app from localhost or HTTPS.', 100);
        log('Marker preload error: ' + error.message);
      }
      updateStartButton();
    }

    async function startCamera() {
      if (cameraStarted || startCameraBtn.disabled) return;
      cameraStarted = true;
      startCameraBtn.disabled = true;
      startCameraBtn.textContent = 'Starting camera...';
      setStartupStatus('Starting camera...', 100);

      try {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) throw new Error('MindAR system is not ready');
        await arSystem.start();
      } catch (error) {
        cameraStarted = false;
        startCameraBtn.disabled = false;
        startCameraBtn.textContent = 'Try Again';
        setStartupStatus('Camera could not start. Check browser permission.', 100);
        log('Camera start error: ' + error.message);
      }
    }

    // Catch any uncaught JS errors
    window.addEventListener('error', (e) => {
      log('❌ JS Error: ' + e.message + ' (' + e.filename?.split('/').pop() + ':' + e.lineno + ')');
    });

    // ============================================================
    //  MARKER EVENTS — auto-play when page is detected
    // ============================================================
    const arTarget = document.getElementById('ar-target');
    const sceneEl  = document.querySelector('a-scene');
    const scanHint = document.getElementById('scan-hint');
    const dioramaScene = document.getElementById('diorama-scene');
    const resetArBtn = document.getElementById('reset-ar-btn');
    const DEFAULT_AR_POSITION = { x: 0, y: 0, z: 0 };
    const DEFAULT_AR_SCALE = 0.025;
    const MIN_AR_SCALE = 0.009;
    const MAX_AR_SCALE = 0.09;
    const DRAG_SENSITIVITY = 0.0022;
    const POSITION_LIMIT = 0.8;
    let arPosition = { ...DEFAULT_AR_POSITION };
    let arScale = DEFAULT_AR_SCALE;
    let lastTouchPoint = null;
    let pinchStartDistance = 0;
    let pinchStartScale = DEFAULT_AR_SCALE;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setDioramaPlacement(position = arPosition, scale = arScale) {
      dioramaScene.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
      dioramaScene.setAttribute('scale', `${scale} ${scale} ${scale}`);
    }

    function resetARPlacement() {
      arPosition = { ...DEFAULT_AR_POSITION };
      arScale = DEFAULT_AR_SCALE;
      lastTouchPoint = null;
      pinchStartDistance = 0;
      pinchStartScale = DEFAULT_AR_SCALE;
      setDioramaPlacement(arPosition, arScale);
    }

    function showScanGuide() {
      scanHint.classList.add('visible');
    }

    function hideScanGuide() {
      scanHint.classList.remove('visible');
    }

    function isUiTouch(event) {
      return Boolean(event.target.closest('#ui-overlay button, #ui-overlay a, #startup-screen'));
    }

    function getTouchPoint(touch) {
      return { x: touch.clientX, y: touch.clientY };
    }

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    function getDragDelta(dx, dy) {
      if (window.matchMedia('(orientation: landscape)').matches) {
        return {
          x: (dx - dy * 0.35) * DRAG_SENSITIVITY,
          y: (-dy - dx * 0.35) * DRAG_SENSITIVITY
        };
      }

      return {
        x: dx * DRAG_SENSITIVITY,
        y: -dy * DRAG_SENSITIVITY
      };
    }

    function handleTouchStart(event) {
      if (!cameraStarted || isUiTouch(event)) return;

      if (event.touches.length === 1) {
        lastTouchPoint = getTouchPoint(event.touches[0]);
      } else if (event.touches.length === 2) {
        lastTouchPoint = null;
        pinchStartDistance = getTouchDistance(event.touches);
        pinchStartScale = arScale;
      }
    }

    function handleTouchMove(event) {
      if (!cameraStarted || isUiTouch(event)) return;
      if (event.cancelable) event.preventDefault();

      if (event.touches.length === 1 && lastTouchPoint) {
        const point = getTouchPoint(event.touches[0]);
        const dx = point.x - lastTouchPoint.x;
        const dy = point.y - lastTouchPoint.y;
        const delta = getDragDelta(dx, dy);

        arPosition.x = clamp(arPosition.x + delta.x, -POSITION_LIMIT, POSITION_LIMIT);
        arPosition.y = clamp(arPosition.y + delta.y, -POSITION_LIMIT, POSITION_LIMIT);
        setDioramaPlacement(arPosition, arScale);
        lastTouchPoint = point;
      } else if (event.touches.length === 2 && pinchStartDistance > 0) {
        const distance = getTouchDistance(event.touches);
        arScale = clamp(pinchStartScale * (distance / pinchStartDistance), MIN_AR_SCALE, MAX_AR_SCALE);
        setDioramaPlacement(arPosition, arScale);
      }
    }

    function handleTouchEnd(event) {
      if (event.touches.length === 1) {
        lastTouchPoint = getTouchPoint(event.touches[0]);
      } else {
        lastTouchPoint = null;
        pinchStartDistance = 0;
        pinchStartScale = arScale;
      }
    }

    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });
    window.addEventListener('touchend', handleTouchEnd, { passive: false });
    window.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    sceneEl.addEventListener('arReady', () => {
      log('MindAR ready - camera active.');
      startupScreen.classList.add('hidden');
      showScanGuide();
      document.getElementById('anim-btn').style.display = 'block';
      resetArBtn.classList.add('visible');
      setTimeout(checkCameraFeed, 1200);
    });
    sceneEl.addEventListener('arError', (e) => {
      cameraStarted = false;
      startCameraBtn.disabled = false;
      startCameraBtn.textContent = 'Try Again';
      setStartupStatus('AR could not start. Check camera permission.', 100);
      log('MindAR error: ' + JSON.stringify(e.detail));
    });
    sceneEl.addEventListener('loaded',  () => {
      sceneLoaded = true;
      setStartupStatus('3D scene ready.', 78);
      updateStartButton();
    });

    assetsEl.addEventListener('loaded', () => {
      assetsLoaded = true;
      setStartupStatus('3D models ready.', 88);
      updateStartButton();
    });

    if (sceneEl.hasLoaded) {
      sceneLoaded = true;
    }

    if (assetsEl.hasLoaded) {
      assetsLoaded = true;
    }

    updateStartButton();
    preloadMarkerFile();

    setTimeout(() => {
      if (!cameraStarted && (!sceneLoaded || !assetsLoaded)) {
        setStartupStatus('Still loading AR engine or models. Check internet if this gets stuck.', 92);
      }
    }, 12000);

    arTarget.addEventListener('targetFound', () => {
      hideScanGuide();
      // Auto-start animation + narration when the book page is detected
      const audio = document.getElementById('narration');
      if (!animationFinished || audio.ended || audio.currentTime === 0) {
        startAnimation();
      }
      startNarration();
    });

    arTarget.addEventListener('targetLost', () => {
      showScanGuide();
      // Pause narration when page is no longer visible (animation keeps going)
      pauseNarration();
    });

    function checkCameraFeed() {
      const videos = Array.from(document.querySelectorAll('video'));
      const activeVideo = videos.find((video) => video.readyState >= 2 && video.videoWidth > 0);
      if (activeVideo) {
        log(`Camera feed visible: ${activeVideo.videoWidth}x${activeVideo.videoHeight}`);
      } else {
        log('Camera feed not visible yet. If the screen is black, reload and try the phone browser directly.');
      }
    }

    ['diorama-base', 'pagong', 'kuneho'].forEach((id) => {
      const model = document.getElementById(id);
      model.addEventListener('model-loaded', () => log(`${id} model loaded.`));
      model.addEventListener('model-error', (event) => {
        log(`${id} model failed: ${event.detail?.src || 'unknown source'}`);
      });
    });

    // ============================================================
    //  NARRATION
    // ============================================================
    function startNarration(restart = false) {
      const audio = document.getElementById('narration');
      if (restart || audio.ended) audio.currentTime = 0;
      audio.play().catch(() => {
        // Autoplay blocked — user will need to tap Play manually
        console.warn('Narration autoplay blocked by browser.');
      });
    }

    function pauseNarration() {
      document.getElementById('narration').pause();
    }

    function stopNarration() {
      const audio = document.getElementById('narration');
      audio.pause();
      audio.currentTime = 0;
    }

    // ============================================================
    //  SCENE 9 - PAGONG REACHES THE FINISH LINE FIRST
    // ============================================================

    const T_P_WALK_END = 6160;
    const T_K_WALK_END = 9000;
    const T_DONE = 9000;
    const WALK_HOP_H = 0.9;
    const P_HOP_FREQ = 2.8;
    const K_HOP_FREQ = 2.7;
    const K_HOP_OFFSET = 0.42;
    const K_WALK_HOP_H = 0.7;

    const P_START = { x: -11.5, y: 1.6, z: 20.2, rot: -80 };
    const P_TARGET = { x: -26.8, y: 1.6, z: 22.4, rot: -80 };
    const K_START = { x: 4.2, y: 4.2, z: 24.6, rot: 90 };
    const K_TARGET = { x: -25.7, y: 4.2, z: 27.0, rot: 95 };

    let animRunning = false;
    let animStart   = null;
    let animFrameId = null;
    let animationFinished = false;
    let confettiFired = false;

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function scene9Tick(timestamp) {
      if (!animStart) animStart = timestamp;
      const elapsed = timestamp - animStart;

      const pagong = document.getElementById('pagong');
      const kuneho = document.getElementById('kuneho');

      if (elapsed < T_P_WALK_END) {
        const t = easeInOut(Math.min(1, elapsed / T_P_WALK_END));
        const x = P_START.x + (P_TARGET.x - P_START.x) * t;
        const z = P_START.z + (P_TARGET.z - P_START.z) * t;
        const bounce = Math.abs(Math.sin(elapsed / 1000 * P_HOP_FREQ * Math.PI)) * WALK_HOP_H;
        pagong.setAttribute('position',
          `${x.toFixed(3)} ${(P_START.y + bounce).toFixed(3)} ${z.toFixed(3)}`);
        pagong.setAttribute('rotation',
          `0 ${P_START.rot} 0`);
      } else {
        pagong.setAttribute('position',
          `${P_TARGET.x} ${P_TARGET.y} ${P_TARGET.z}`);
        pagong.setAttribute('rotation',
          `0 ${P_TARGET.rot} 0`);

        if (!confettiFired) {
          confettiFired = true;
          fireFinishConfetti();
          playFinishSound();
        }
      }

      if (elapsed < T_K_WALK_END) {
        const t = easeInOut(Math.min(1, elapsed / T_K_WALK_END));
        const x = K_START.x + (K_TARGET.x - K_START.x) * t;
        const z = K_START.z + (K_TARGET.z - K_START.z) * t;
        const rot = K_START.rot + (K_TARGET.rot - K_START.rot) * t;
        const bounce = Math.abs(Math.sin((elapsed / 1000 * K_HOP_FREQ + K_HOP_OFFSET) * Math.PI)) * K_WALK_HOP_H;
        kuneho.setAttribute('position',
          `${x.toFixed(3)} ${(K_START.y + bounce).toFixed(3)} ${z.toFixed(3)}`);
        kuneho.setAttribute('rotation',
          `0 ${rot.toFixed(2)} 0`);
      } else {
        kuneho.setAttribute('position',
          `${K_TARGET.x} ${K_TARGET.y} ${K_TARGET.z}`);
        kuneho.setAttribute('rotation',
          `0 ${K_TARGET.rot} 0`);
      }

      if (elapsed >= T_DONE) {
        finishAnimation();
        return;
      }
      if (animRunning) animFrameId = requestAnimationFrame(scene9Tick);
    }

    function fireFinishConfetti() {
      if (typeof confetti !== 'function') return;
      confetti({
        particleCount: 90,
        spread: 70,
        origin: { x: 0.5, y: 0.48 },
        scalar: 1.05
      });
      setTimeout(() => {
        confetti({
          particleCount: 45,
          spread: 90,
          origin: { x: 0.58, y: 0.42 },
          scalar: 0.85
        });
      }, 220);
    }

    function playFinishSound() {
      const sound = document.getElementById('finish-sound');
      if (!sound) return;
      sound.pause();
      sound.currentTime = 0;
      sound.volume = 0.85;
      sound.play().catch(() => {});
    }

    // ============================================================
    //  PLAY / STOP
    // ============================================================
    function handleAnimBtn() {
      animRunning ? stopAnimation() : startAnimation();
    }

    function startAnimation() {
      if (animRunning) return;
      animRunning = true;
      animStart   = null;
      animationFinished = false;
      confettiFired = false;
      document.getElementById('finish-sound')?.load();

      resetToStart();

      const btn = document.getElementById('anim-btn');
      btn.classList.add('playing');
      btn.innerHTML = '&#9646; &nbsp; Ihinto';

      animFrameId = requestAnimationFrame(scene9Tick);

      // Also start narration when user manually taps Play
      startNarration(true);
    }

    function finishAnimation() {
      animRunning = true;
      animationFinished = true;
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

      document.getElementById('pagong').setAttribute('position',
        `${P_TARGET.x} ${P_TARGET.y} ${P_TARGET.z}`);
      document.getElementById('pagong').setAttribute('rotation',
        `0 ${P_TARGET.rot} 0`);
      document.getElementById('kuneho').setAttribute('position',
        `${K_TARGET.x} ${K_TARGET.y} ${K_TARGET.z}`);
      document.getElementById('kuneho').setAttribute('rotation',
        `0 ${K_TARGET.rot} 0`);

      if (document.getElementById('narration').ended) stopAnimation();
    }

    function resetToStart() {
      document.getElementById('pagong').setAttribute('position',
        `${P_START.x} ${P_START.y} ${P_START.z}`);
      document.getElementById('pagong').setAttribute('rotation',
        `0 ${P_START.rot} 0`);
      document.getElementById('kuneho').setAttribute('position',
        `${K_START.x} ${K_START.y} ${K_START.z}`);
      document.getElementById('kuneho').setAttribute('rotation',
        `0 ${K_START.rot} 0`);
    }

    function stopAnimation() {
      animRunning = false;
      animationFinished = false;
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

      resetToStart();

      const sound = document.getElementById('finish-sound');
      if (sound) {
        sound.pause();
        sound.currentTime = 0;
      }

      const btn = document.getElementById('anim-btn');
      btn.classList.remove('playing');
      btn.innerHTML = '&#9654; &nbsp; I-play';

      stopNarration();
    }

    document.getElementById('narration').addEventListener('ended', stopAnimation);
  </script>

</body>
