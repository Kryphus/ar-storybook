<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Si Pagong at si Kuneho — AR Storybook</title>
  <meta name="description"
    content="An augmented reality storybook experience of the classic Filipino fable, Si Pagong at si Kuneho. Scan the pages and watch the story come to life in 3D voxel art!">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js"></script>
  <link rel="stylesheet" href="landing.css">
  <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/images/favicon/site.webmanifest">
</head>

<body class="is-loading">
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-card">
      <lottie-player
        class="loader-lottie"
        src="assets/images/cat-loading.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
      <p class="loader-title">Loading storybook assets...</p>
      <div class="loader-track" aria-hidden="true">
        <span id="loader-bar"></span>
      </div>
      <p class="loader-size" id="loader-size">0.0 MB / 37.3 MB</p>
    </div>
  </div>

  <div class="landing-page">

    <!-- Music Toggle -->
    <button class="music-toggle" id="music-toggle" aria-label="Toggle background music">
      <span class="music-icon">♫</span>
    </button>
    <audio id="bg-music" loop preload="auto">
      <source src="assets/audio/bgmusic.mp3" type="audio/mpeg">
    </audio>

    <!-- Background Hero Image -->
    <div class="bg-hero">
      <img data-src="assets/images/bghero.png" alt="Voxel forest scene with turtle and rabbit at the starting line"
        id="bg-hero-img">
    </div>

    <!-- Floating Particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Title Logo -->
      <div class="title-container fade-in">
        <img data-src="assets/images/titletext.png" alt="Si Pagong at si Kuneho">
      </div>

      <!-- Subtitle -->
      <p class="subtitle fade-in fade-in-delay-1">
        <span class="sparkle"></span> AR Storybook Adventure <span class="sparkle"></span>
      </p>

      <!-- Start Button -->
      <div class="start-btn-container fade-in fade-in-delay-2" id="start-btn" onclick="startAR()" role="button"
        tabindex="0" aria-label="Start AR Camera">
        <img data-src="assets/images/woodenbanner.png" alt="">
        <span class="start-btn-text">Start</span>
      </div>

      <!-- Mini Game Button -->
      <div class="start-btn-container mini-game-btn fade-in fade-in-delay-3" id="mini-game-btn"
        onclick="startMiniGame()" role="button" tabindex="0" aria-label="Open Mini Game">
        <img data-src="assets/images/woodenbanner.png" alt="">
        <span class="start-btn-text">Mini Game</span>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer-credits fade-in fade-in-delay-3">
      AR Storybook � 2026
    </div>

  </div>

  <script>
    const visibleImagePreloadFiles = [
      'assets/images/cat-loading.json',
      'assets/images/bghero.png',
      'assets/images/titletext.png',
      'assets/images/woodenbanner.png',
      'assets/images/markers/page1.jpg',
      'assets/images/markers/page2.jpg',
      'assets/images/markers/page3.jpg',
      'assets/images/markers/page4.jpg',
      'assets/images/markers/page5.jpg',
      'assets/images/markers/page6.jpg',
      'assets/images/markers/page7.jpg',
      'assets/images/markers/page8.jpg',
      'assets/images/markers/page9.jpg',
      'assets/images/markers/page10.jpg'
    ];

    const pagePreloadFiles = [
      'pages.html',
      'pages.css'
    ];

    const arPreloadFiles = [
      'assets/audio/bgmusic.mp3',
      'assets/images/markers/targets-scene1.mind',
      'assets/images/markers/targets-scene2.mind',
      'assets/images/markers/targets-scene3.mind',
      'assets/images/markers/targets-scene4.mind',
      'assets/images/markers/targets-scene5.mind',
      'scenes/scene1/diorama.glb',
      'scenes/scene2/diorama.glb',
      'scenes/scene3/diorama.glb',
      'scenes/scene4/diorama.glb',
      'scenes/scene5/diorama.glb',
      'models/turtle.glb',
      'models/rabbit.glb',
      'assets/audio/scene1.mp3',
      'assets/audio/scene2.mp3',
      'assets/audio/scene3.mp3',
      'assets/audio/scene4.mp3',
      'assets/audio/scene5.mp3'
    ];

    const loaderBar = document.getElementById('loader-bar');
    const loaderSize = document.getElementById('loader-size');
    const minLoaderMs = 900;
    const loaderStartedAt = performance.now();
    let loadedCount = 0;
    const totalAssets = visibleImagePreloadFiles.length + pagePreloadFiles.length + arPreloadFiles.length;
    const assetByteSizes = {
      'assets/images/cat-loading.json': 65934,
      'assets/images/bghero.png': 2023357,
      'assets/images/titletext.png': 2259825,
      'assets/images/woodenbanner.png': 3286944,
      'assets/images/markers/page1.jpg': 340527,
      'assets/images/markers/page2.jpg': 341565,
      'assets/images/markers/page3.jpg': 314705,
      'assets/images/markers/page4.jpg': 359794,
      'assets/images/markers/page5.jpg': 372749,
      'assets/images/markers/page6.jpg': 332165,
      'assets/images/markers/page7.jpg': 318553,
      'assets/images/markers/page8.jpg': 310569,
      'assets/images/markers/page9.jpg': 352295,
      'assets/images/markers/page10.jpg': 346113,
      'pages.html': 9359,
      'pages.css': 6691,
      'assets/audio/bgmusic.mp3': 7517612,
      'assets/images/markers/targets-scene1.mind': 980472,
      'assets/images/markers/targets-scene2.mind': 1020800,
      'assets/images/markers/targets-scene3.mind': 971232,
      'assets/images/markers/targets-scene4.mind': 1008997,
      'assets/images/markers/targets-scene5.mind': 1024827,
      'scenes/scene1/diorama.glb': 1092612,
      'scenes/scene2/diorama.glb': 2118620,
      'scenes/scene3/diorama.glb': 2118620,
      'scenes/scene4/diorama.glb': 4601452,
      'scenes/scene5/diorama.glb': 4601452,
      'models/turtle.glb': 115884,
      'models/rabbit.glb': 31180,
      'assets/audio/scene1.mp3': 167599,
      'assets/audio/scene2.mp3': 174878,
      'assets/audio/scene3.mp3': 169916,
      'assets/audio/scene4.mp3': 228459,
      'assets/audio/scene5.mp3': 154328
    };
    const totalPreloadBytes = Object.values(assetByteSizes).reduce((sum, bytes) => sum + bytes, 0);
    let loadedBytes = 0;

    function formatMB(bytes) {
      return (bytes / 1024 / 1024).toFixed(1);
    }

    function updateLoaderSize() {
      loaderSize.textContent = `${formatMB(loadedBytes)} MB / ${formatMB(totalPreloadBytes)} MB`;
    }

    function markAssetLoaded(url) {
      loadedCount += 1;
      loadedBytes = Math.min(totalPreloadBytes, loadedBytes + (assetByteSizes[url] || 0));
      loaderBar.style.width = Math.min(96, 8 + Math.round((loadedCount / totalAssets) * 88)) + '%';
      updateLoaderSize();
    }

    function preloadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = async () => {
          try {
            if (img.decode) await img.decode();
          } catch (_) {
            // The image is already loaded; decoding failures should not trap users.
          }
          markAssetLoaded(url);
          resolve();
        };
        img.onerror = () => {
          markAssetLoaded(url);
          resolve();
        };
        img.src = url;
      });
    }

    function preloadFile(url) {
      return fetch(url, { cache: 'force-cache' })
        .catch(() => {
          // The destination pages still perform their own loading and error reporting.
        })
        .finally(() => markAssetLoaded(url));
    }

    function assignLandingImageSources() {
      document.querySelectorAll('.landing-page img[data-src]').forEach((img) => {
        img.src = img.dataset.src;
      });
    }

    async function decodeLandingImages() {
      const images = Array.from(document.querySelectorAll('.landing-page img'));
      await Promise.allSettled(images.map(async (img) => {
        if (!img.complete) {
          await new Promise((resolve) => {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        }

        if (img.decode) {
          try {
            await img.decode();
          } catch (_) {
            // Already loaded images can still reject decode in some browsers.
          }
        }
      }));
    }

    function preloadVisibleExperience() {
      const imageWork = visibleImagePreloadFiles.map(preloadImage);
      const pageWork = pagePreloadFiles.map(preloadFile);
      const arWork = arPreloadFiles.map(preloadFile);
      return Promise.allSettled([...imageWork, ...pageWork, ...arWork])
        .then(() => {
          assignLandingImageSources();
          return decodeLandingImages();
        });
    }

    function hideLoader() {
      const elapsed = performance.now() - loaderStartedAt;
      const remaining = Math.max(0, minLoaderMs - elapsed);

      setTimeout(() => {
        loaderBar.style.width = '100%';
        loadedBytes = totalPreloadBytes;
        updateLoaderSize();
        document.body.classList.remove('is-loading');
        document.body.classList.add('is-ready');
      }, remaining);
    }

    const preloadWork = preloadVisibleExperience();
    preloadWork.then(hideLoader);

    setTimeout(() => {
      if (document.body.classList.contains('is-loading')) {
        document.querySelector('.loader-title').textContent = 'Still loading assets... almost there.';
      }
    }, 7000);

    // Start AR — navigates to the actual AR page
    function startAR() {
      const btn = document.getElementById('start-btn');
      btn.classList.add('clicked');
      // Small delay so the click animation plays before navigating
      setTimeout(() => {
        window.location.href = 'pages.html';
      }, 400);
    }

    function startMiniGame() {
      const btn = document.getElementById('mini-game-btn');
      btn.classList.add('clicked');
      setTimeout(() => {
        window.location.href = 'game/';
      }, 400);
    }

    // Allow keyboard activation of the start button
    document.getElementById('start-btn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startAR();
      }
    });

    document.getElementById('mini-game-btn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startMiniGame();
      }
    });

    // Music — shared controller
  </script>
  <script src="music.js"></script>

</body>

</html>
