<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Treasure Hunt Sandbox</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #f7d9a6;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #2f261d;
      background: rgba(255, 255, 255, 0.78);
      text-align: center;
      backdrop-filter: blur(8px);
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    body.is-ready #loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loader-content {
      width: min(320px, 100%);
    }

    #loader-title {
      margin: 0 0 16px;
      font-size: 1.55rem;
      font-weight: 900;
    }

    #loader-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(47, 38, 29, 0.12);
    }

    #loader-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #2f261d;
      transition: width 0.2s ease;
    }

    #top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    #title-pill,
    #hint-pill {
      padding: 8px 12px;
      border-radius: 999px;
      color: rgba(59, 37, 7, 0.8);
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 10px 28px rgba(92, 64, 28, 0.12);
      font-size: 0.78rem;
      font-weight: 900;
      backdrop-filter: blur(10px);
    }

    #hint-pill {
      color: rgba(59, 37, 7, 0.62);
      font-size: 0.72rem;
      font-weight: 800;
    }

    #tweak-toggle {
      position: fixed;
      top: 58px;
      right: 14px;
      z-index: 210;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(47, 38, 29, 0.08);
      border-radius: 999px;
      color: #3b2507;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 10px 24px rgba(92, 64, 28, 0.13);
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #tweak-panel {
      position: fixed;
      top: 108px;
      right: 14px;
      bottom: 14px;
      z-index: 200;
      width: min(330px, calc(100vw - 28px));
      overflow-y: auto;
      padding: 14px;
      border: 1px solid rgba(47, 38, 29, 0.1);
      border-radius: 18px;
      color: #2f261d;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 44px rgba(92, 64, 28, 0.16);
      backdrop-filter: blur(16px);
      transition: transform 0.22s ease, opacity 0.22s ease, visibility 0.22s ease;
    }

    body.tweaks-closed #tweak-panel {
      opacity: 0;
      visibility: hidden;
      transform: translateX(calc(100% + 22px));
      pointer-events: none;
    }

    #tweak-panel h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .tweak-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(47, 38, 29, 0.12);
    }

    .tweak-section h3 {
      margin: 0 0 9px;
      color: rgba(47, 38, 29, 0.8);
      font-size: 0.88rem;
      font-weight: 900;
    }

    .control-row {
      display: grid;
      grid-template-columns: 54px 1fr 68px;
      align-items: center;
      gap: 7px;
      margin: 7px 0;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .control-row input[type="range"] {
      width: 100%;
    }

    .control-row input[type="number"] {
      width: 68px;
      border: 1px solid rgba(47, 38, 29, 0.14);
      border-radius: 8px;
      padding: 4px 5px;
      color: #2f261d;
      background: rgba(255, 255, 255, 0.68);
      font: inherit;
      text-align: right;
    }

    #actions {
      position: sticky;
      bottom: -14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px -14px -14px;
      padding: 12px 14px 14px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
    }

    #actions button {
      border: none;
      border-radius: 999px;
      padding: 10px 12px;
      color: #3b2507;
      background: linear-gradient(135deg, #ffd166 0%, #f59e0b 100%);
      font-weight: 900;
      cursor: pointer;
    }

    #actions button.secondary {
      color: #374151;
      background: linear-gradient(135deg, #f3f4f6 0%, #d1d5db 100%);
    }

    #output {
      grid-column: 1 / -1;
      min-height: 54px;
      margin: 0;
      padding: 9px;
      overflow: auto;
      border-radius: 10px;
      color: rgba(47, 38, 29, 0.78);
      background: rgba(47, 38, 29, 0.08);
      font-family: Consolas, monospace;
      font-size: 0.68rem;
      white-space: pre-wrap;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
    }

    @media (max-width: 620px) {
      #top-bar {
        right: 70px;
      }

      #hint-pill {
        display: none;
      }

      #tweak-panel {
        top: 106px;
        width: min(340px, calc(100vw - 18px));
        right: 9px;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="assets/images/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/images/favicon/site.webmanifest">
</head>

<body>
  <div id="loader">
    <div id="loader-content">
      <h1 id="loader-title">Loading game sandbox</h1>
      <div id="loader-track">
        <div id="loader-fill"></div>
      </div>
    </div>
  </div>

  <div id="top-bar">
    <div id="title-pill">Treasure Hunt Sandbox</div>
    <div id="hint-pill">Drag to orbit | Scroll/pinch to zoom | Right-click to pan</div>
  </div>

  <button id="tweak-toggle" type="button" onclick="toggleTweaks()" aria-label="Toggle tweaks">☰</button>

  <aside id="tweak-panel">
    <h2>Chest Placement Tweaks</h2>
    <div id="controls"></div>
    <div id="actions">
      <button type="button" onclick="copyValues()">Copy Values</button>
      <button class="secondary" type="button" onclick="resetDefaults()">Reset</button>
      <pre id="output"></pre>
    </div>
  </aside>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    loading-screen="enabled: false" background="color: #f7d9a6" shadow="type: pcfsoft">
    <a-assets>
      <a-asset-item id="diorama-model" src="models/castle.glb"></a-asset-item>
      <a-asset-item id="gold-chest-model" src="models/chests/gold_chest.glb"></a-asset-item>
    </a-assets>

    <a-sky color="#f7d9a6"></a-sky>

    <a-entity id="game-scene" position="0 0 0" rotation="0 0 0">
      <a-entity id="diorama-base" gltf-model="#diorama-model" shadow="cast: true; receive: true"></a-entity>

      <a-entity id="chest-1" gltf-model="#gold-chest-model" shadow="cast: true; receive: true"></a-entity>
      <a-entity id="chest-2" gltf-model="#gold-chest-model" shadow="cast: true; receive: true"></a-entity>
      <a-entity id="chest-3" gltf-model="#gold-chest-model" shadow="cast: true; receive: true"></a-entity>
    </a-entity>

    <a-light type="ambient" color="#fff6e6" intensity="0.58"></a-light>
    <a-light type="directional" color="#ffd08a" intensity="1.35" position="-6 4 5" shadow="cast: true"></a-light>
    <a-light type="point" color="#fff0c2" intensity="0.85" distance="22" position="-5 5 4"></a-light>
    <a-light type="point" color="#c7ddff" intensity="0.28" distance="18" position="6 4 -5"></a-light>

    <a-entity id="game-camera" camera position="0 4 10"
      orbit-controls="target: 0 1 0; minDistance: 1; maxDistance: 48; initialPosition: 0 4 10; enableDamping: true; dampingFactor: 0.1; rotateSpeed: 0.5; zoomSpeed: 0.8">
    </a-entity>
  </a-scene>

  <script>
    const STORAGE_KEY = 'treasureGameSandboxTweaks:v1';
    const DEFAULT_VALUES = {
      diorama: { id: 'diorama-base', label: 'Diorama', scale: 2.001, x: 0, y: 0, z: 0, ry: 0, rx: 0, rz: 0 },
      chest1: { id: 'chest-1', label: 'Gold Chest 1', scale: 0.5, x: -7, y: 5.5, z: 4.2, ry: 180, rx: 0, rz: 0 },
      chest2: { id: 'chest-2', label: 'Gold Chest 2', scale: 0.5, x: 7.5, y: 5.5, z: -5, ry: 180, rx: 0, rz: 0 },
      chest3: { id: 'chest-3', label: 'Gold Chest 3', scale: 0.5, x: 16.6, y: 4.4, z: 10.4, ry: 5, rx: 0, rz: 0 }
    };

    const FIELD_CONFIG = {
      scale: { label: 'Scale', min: 0.001, max: 3.5, step: 0.001 },
      x: { label: 'X', min: -40, max: 40, step: 0.1 },
      y: { label: 'Y', min: -10, max: 30, step: 0.1 },
      z: { label: 'Z', min: -40, max: 40, step: 0.1 },
      ry: { label: 'Rot Y', min: -180, max: 180, step: 1 },
      rx: { label: 'Rot X', min: -180, max: 180, step: 1 },
      rz: { label: 'Rot Z', min: -180, max: 180, step: 1 }
    };

    const PRELOAD_ASSETS = [
      'models/castle.glb',
      'models/chests/gold_chest.glb'
    ];

    let values = loadValues();

    function cloneDefaults() {
      return JSON.parse(JSON.stringify(DEFAULT_VALUES));
    }

    function loadValues() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return cloneDefaults();
        return {
          ...cloneDefaults(),
          ...saved
        };
      } catch {
        return cloneDefaults();
      }
    }

    function saveValues() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
    }

    function formatNumber(value) {
      return Number(value).toFixed(3).replace(/\.?0+$/, '');
    }

    function applyEntity(key) {
      const item = values[key];
      const entity = document.getElementById(item.id);
      entity.setAttribute('position', `${item.x} ${item.y} ${item.z}`);
      entity.setAttribute('rotation', `${item.rx} ${item.ry} ${item.rz}`);
      entity.setAttribute('scale', `${item.scale} ${item.scale} ${item.scale}`);
    }

    function applyAll() {
      Object.keys(values).forEach(applyEntity);
      updateOutput();
    }

    function setValue(key, field, rawValue) {
      values[key][field] = Number(rawValue);
      applyEntity(key);
      saveValues();
      syncInputs(key, field);
      updateOutput();
    }

    function syncInputs(key, field) {
      const value = values[key][field];
      document.querySelectorAll(`[data-key="${key}"][data-field="${field}"]`).forEach(input => {
        if (Number(input.value) !== value) input.value = value;
      });
    }

    function createControl(key, field) {
      const config = FIELD_CONFIG[field];
      const value = values[key][field];
      return `
        <label class="control-row">
          <span>${config.label}</span>
          <input type="range" min="${config.min}" max="${config.max}" step="${config.step}" value="${value}"
            data-key="${key}" data-field="${field}">
          <input type="number" min="${config.min}" max="${config.max}" step="${config.step}" value="${value}"
            data-key="${key}" data-field="${field}">
        </label>
      `;
    }

    function renderControls() {
      const controls = document.getElementById('controls');
      controls.innerHTML = Object.entries(values).map(([key, item]) => `
        <section class="tweak-section">
          <h3>${item.label}</h3>
          ${Object.keys(FIELD_CONFIG).map(field => createControl(key, field)).join('')}
        </section>
      `).join('');

      controls.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', event => {
          setValue(event.target.dataset.key, event.target.dataset.field, event.target.value);
        });
      });
    }

    function getValuesText() {
      return [
        `Diorama: model=castle.glb, scale=${formatNumber(values.diorama.scale)}, y=${formatNumber(values.diorama.y)}, rot=${formatNumber(values.diorama.ry)}, tilt=${formatNumber(values.diorama.rx)}`,
        `Gold Chest 1: scale=${formatNumber(values.chest1.scale)}, pos=(${formatNumber(values.chest1.x)}, ${formatNumber(values.chest1.y)}, ${formatNumber(values.chest1.z)}), rot=${formatNumber(values.chest1.ry)}`,
        `Gold Chest 2: scale=${formatNumber(values.chest2.scale)}, pos=(${formatNumber(values.chest2.x)}, ${formatNumber(values.chest2.y)}, ${formatNumber(values.chest2.z)}), rot=${formatNumber(values.chest2.ry)}`,
        `Gold Chest 3: scale=${formatNumber(values.chest3.scale)}, pos=(${formatNumber(values.chest3.x)}, ${formatNumber(values.chest3.y)}, ${formatNumber(values.chest3.z)}), rot=${formatNumber(values.chest3.ry)}`,
        'Scene height: 0'
      ].join('\n');
    }

    function updateOutput() {
      document.getElementById('output').textContent = getValuesText();
    }

    function copyValues() {
      const text = getValuesText();
      updateOutput();
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(text).catch(() => {});
    }

    function resetDefaults() {
      values = cloneDefaults();
      saveValues();
      renderControls();
      applyAll();
    }

    function toggleTweaks() {
      document.body.classList.toggle('tweaks-closed');
    }

    async function preloadAssets() {
      const fill = document.getElementById('loader-fill');
      let loaded = 0;

      await Promise.all(PRELOAD_ASSETS.map(async asset => {
        try {
          const response = await fetch(asset, { cache: 'force-cache' });
          if (!response.ok) throw new Error(`Failed to preload ${asset}`);
          await response.blob();
        } catch (error) {
          console.warn(error);
        } finally {
          loaded += 1;
          fill.style.width = `${Math.round((loaded / PRELOAD_ASSETS.length) * 100)}%`;
        }
      }));

      await new Promise(resolve => {
        const assets = document.querySelector('a-assets');
        if (assets.hasLoaded) {
          resolve();
        } else {
          assets.addEventListener('loaded', resolve, { once: true });
        }
      });

      document.body.classList.add('is-ready');
    }

    renderControls();
    applyAll();
    preloadAssets();
  </script>
</body>

</html>
